<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oposiciones PT — Mi cuenta</title>
<link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
  :root {
    --color-verde-esmeralda: #1E8A6E;
    --color-verde-menta: #D4EBE8;
    --color-amarillo-mostaza: #F2C94C;
    --color-gris-carbon: #3A3A3A;
    --color-gris-cabecera: #F4F4F2;
    --color-fondo: #EDEDEA;
    --color-borde: #E0E0DC;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--color-fondo); margin: 0; display: flex; justify-content: center; }
  .pantalla { width: 100%; max-width: 400px; background: #FFFFFF; min-height: 100vh; }
  .cabecera-app { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--color-gris-cabecera); border-bottom: 1px solid var(--color-borde); }
  .marca { font-family: 'Pompiere', cursive; font-size: 19px; color: var(--color-gris-carbon); }
  .volver { cursor: pointer; font-size: 20px; color: var(--color-gris-carbon); }
  .contenido { padding: 24px 16px; }
  .titulo { font-size: 16px; font-weight: 800; margin: 0 0 18px; }
  .fila-dato { display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid var(--color-borde); border-radius: 12px; margin-bottom: 10px; }
  .fila-dato .icono { width: 36px; height: 36px; border-radius: 50%; background: var(--color-verde-menta); display: flex; align-items: center; justify-content: center; color: var(--color-verde-esmeralda); font-size: 17px; }
  .fila-dato .texto .etiqueta { font-size: 11px; color: #7A7A7A; }
  .fila-dato .texto .valor { font-size: 14px; font-weight: 700; color: var(--color-gris-carbon); }
  .badge-activo { display: inline-block; background: var(--color-verde-menta); color: var(--color-verde-esmeralda); font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
  .badge-inactivo { display: inline-block; background: #FBE0D5; color: #D96C56; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; }
</style>
</head>
<body>
<div class="pantalla">
  <div class="cabecera-app">
    <span class="volver" onclick="window.location.href='inicio.html'">←</span>
    <span class="marca">Mi cuenta</span>
    <svg style="margin-left:auto;" width="28" height="28" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16.5" fill="#D4EBE8" stroke="#F2C94C" stroke-width="1.4" stroke-dasharray="2 2.4"/>
      <text x="18" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3A3A3A">AS</text>
    </svg>
  </div>

  <div class="contenido">
    <p class="titulo">Datos de acceso</p>

    <div class="fila-dato">
      <div class="icono"><i class="ti ti-mail" aria-hidden="true"></i></div>
      <div class="texto">
        <div class="etiqueta">Email</div>
        <div class="valor" id="valorEmail">—</div>
      </div>
    </div>

    <div class="fila-dato">
      <div class="icono"><i class="ti ti-user-check" aria-hidden="true"></i></div>
      <div class="texto">
        <div class="etiqueta">Estado</div>
        <div class="valor" id="valorEstado">—</div>
      </div>
    </div>
  </div>
</div>

<script>
  const URL_API = 'https://script.google.com/macros/s/AKfycbxylD45E6vlENV_Ttrl54jWPvhaQ1YdCBedoIQANAmM0UjDPEnWWRfa2_VpVSxR01ho/exec';

  const sesionTexto = localStorage.getItem('sesionOposicionesPT');
  if (!sesionTexto) {
    window.location.href = 'index.html';
  }
  const sesion = JSON.parse(sesionTexto);

  async function llamarBackend(accion, datos) {
    const respuesta = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion, datos }) });
    return respuesta.json();
  }

  async function cargarCuenta() {
    document.getElementById('valorEmail').textContent = sesion.email;

    const resultado = await llamarBackend('obtenerFicha', { email: sesion.email });
    const estadoDiv = document.getElementById('valorEstado');
    if (resultado.exito) {
      const activa = resultado.resultado.activa === true;
      estadoDiv.innerHTML = activa
        ? '<span class="badge-activo">ACTIVO</span>'
        : '<span class="badge-inactivo">INACTIVO</span>';
    } else {
      estadoDiv.textContent = 'No disponible';
    }
  }

  cargarCuenta();
</script>
</body>
</html>
