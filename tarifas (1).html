<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oposiciones PT — Tarifas</title>
<link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
  :root {
    --color-verde-esmeralda: #1E8A6E;
    --color-verde-menta: #D4EBE8;
    --color-amarillo-mostaza: #F2C94C;
    --color-gris-carbon: #3A3A3A;
    --color-gris-cabecera: #F4F4F2;
    --color-gris-seccion: #96A9A4;
    --color-fondo: #EDEDEA;
    --color-borde: #E0E0DC;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--color-fondo); margin: 0; display: flex; justify-content: center; }
  .pantalla { width: 100%; max-width: 400px; background: #FFFFFF; min-height: 100vh; }
  .cabecera-app { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--color-gris-cabecera); border-bottom: 1px solid var(--color-borde); }
  .marca { font-family: 'Pompiere', cursive; font-size: 19px; color: var(--color-gris-carbon); }
  .volver { cursor: pointer; font-size: 20px; color: var(--color-gris-carbon); }
  .contenido { padding: 20px 16px 32px; }

  .franja-mes { display: flex; align-items: center; gap: 8px; background: var(--color-gris-seccion); border-radius: 10px; padding: 10px 12px; margin-bottom: 4px; }
  .franja-mes span.titulo { font-size: 14px; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 0.5px; }
  .caja-precio-roja { margin-left: auto; background: #D9534F; border-radius: 8px; padding: 6px 12px; text-align: center; flex-shrink: 0; }
  .caja-precio-roja .precio { font-size: 16px; font-weight: 800; color: #fff; line-height: 1.1; }
  .caja-precio-roja .sub { font-size: 9px; color: #FDE2E1; line-height: 1.2; }

  .subtitulo { font-size: 10.5px; color: #7A7A7A; margin: 0 0 12px; }

  .cabecera-columnas { display: grid; grid-template-columns: 1.6fr 0.8fr 0.8fr 0.8fr; gap: 6px; padding: 0 2px; margin-bottom: 6px; }
  .cabecera-columnas span { font-size: 9px; font-weight: 700; color: #7A7A7A; text-align: center; text-transform: uppercase; }
  .cabecera-columnas span:first-child { text-align: left; }

  .fila-servicio { display: grid; grid-template-columns: 1.6fr 0.8fr 0.8fr 0.8fr; gap: 6px; align-items: center; padding: 10px 2px; border-bottom: 1px solid #F0F0EC; }
  .fila-servicio .concepto { font-size: 11.5px; font-weight: 600; color: var(--color-gris-carbon); }
  .precio-pill { text-align: center; font-size: 12px; font-weight: 800; border-radius: 14px; padding: 4px 0; }
  .pill-vacio { color: #B0B0AC; font-size: 13px; text-align: center; }
  .pill-estrella { background: var(--color-amarillo-mostaza); color: #7A5A00; }
  .pill-as { background: var(--color-verde-menta); color: var(--color-verde-esmeralda); }
  .pill-otros { background: #FBE0D0; color: #C9591C; }

  .contacto { display: flex; align-items: center; gap: 8px; justify-content: center; margin-top: 20px; padding: 12px; background: var(--color-gris-cabecera); border-radius: 12px; font-size: 12px; color: var(--color-gris-carbon); }
  .cargando { text-align: center; color: #7A7A7A; font-size: 13px; padding: 30px 0; }
</style>
</head>
<body>
<div class="pantalla">
  <div class="cabecera-app">
    <span class="volver" onclick="window.location.href='inicio.html'">←</span>
    <span class="marca">Tarifas</span>
    <svg style="margin-left:auto;" width="28" height="28" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16.5" fill="#D4EBE8" stroke="#F2C94C" stroke-width="1.4" stroke-dasharray="2 2.4"/>
      <text x="18" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3A3A3A">AS</text>
    </svg>
  </div>

  <div class="contenido" id="contenidoTarifas">
    <p class="cargando">Cargando tarifas...</p>
  </div>
</div>

<script>
  const URL_API = 'https://script.google.com/macros/s/AKfycbxylD45E6vlENV_Ttrl54jWPvhaQ1YdCBedoIQANAmM0UjDPEnWWRfa2_VpVSxR01ho/exec';

  async function llamarBackend(accion, datos) {
    const respuesta = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion, datos }) });
    return respuesta.json();
  }

  function celda(valor, clase) {
    if (valor === '' || valor === null || valor === undefined) {
      return '<span class="pill-vacio">–</span>';
    }
    return `<span class="precio-pill ${clase}">${valor}€</span>`;
  }

  async function cargarTarifas() {
    const resultado = await llamarBackend('obtenerTarifas', {});
    const contenedor = document.getElementById('contenidoTarifas');

    if (!resultado.exito) {
      contenedor.innerHTML = `<p class="cargando">No se pudieron cargar las tarifas.</p>`;
      return;
    }

    const filas = resultado.resultado;
    const paquetePrincipal = filas.find(f => f.concepto === 'Paquete Septiembre-Diciembre');
    const paqueteAntiguas = filas.find(f => f.concepto === 'Paquete Antiguas Alumnas');
    const servicios = filas.filter(f => f.concepto !== 'Paquete Septiembre-Diciembre' && f.concepto !== 'Paquete Antiguas Alumnas');

    let html = `
      <div class="franja-mes">
        <span class="titulo">Septiembre – Diciembre</span>
        <div class="caja-precio-roja">
          <div class="precio">${paquetePrincipal ? paquetePrincipal.as : '—'}€</div>
          <div class="sub">${paqueteAntiguas ? paqueteAntiguas.as + '€' : ''} antiguas alumnas</div>
        </div>
      </div>
      <p class="subtitulo">Miércoles 17:00–20:00 · Formación 17:00–18:15 · Tutorías y defensas 18:30–20:00</p>

      <div class="franja-mes" style="margin-top:18px;">
        <span class="titulo">Enero – Febrero</span>
      </div>
      <p class="subtitulo">⭐ preparación desde septiembre · AS alumnas actuales · Otros/as</p>

      <div class="cabecera-columnas">
        <span></span><span>⭐</span><span>AS</span><span>Otros</span>
      </div>
    `;

    servicios.forEach(s => {
      html += `
        <div class="fila-servicio">
          <span class="concepto">${s.concepto}</span>
          ${celda(s.estrella, 'pill-estrella')}
          ${celda(s.as, 'pill-as')}
          ${celda(s.otros, 'pill-otros')}
        </div>`;
    });

    html += `
      <div class="contacto">
        <i class="ti ti-mail" aria-hidden="true"></i>
        as.pedagogíainclusiva@gmail.com
      </div>`;

    contenedor.innerHTML = html;
  }

  cargarTarifas();
</script>
</body>
</html>
