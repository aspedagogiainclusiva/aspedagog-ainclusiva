<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oposiciones PT — Mi ficha</title>
<link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --color-verde-esmeralda: #1E8A6E;
    --color-verde-menta: #D4EBE8;
    --color-amarillo-mostaza: #F2C94C;
    --color-gris-carbon: #3A3A3A;
    --color-gris-cabecera: #F4F4F2;
    --color-gris-seccion: #96A9A4;
    --color-fondo: #EDEDEA;
    --color-borde: #E0E0DC;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--color-fondo); margin: 0; display: flex; justify-content: center; }
  .pantalla { width: 100%; max-width: 400px; background: #FFFFFF; min-height: 100vh; }
  .cabecera-app { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--color-gris-cabecera); border-bottom: 1px solid var(--color-borde); }
  .marca { font-family: 'Pompiere', cursive; font-size: 19px; color: var(--color-gris-carbon); }
  .volver { cursor: pointer; font-size: 20px; color: var(--color-gris-carbon); }
  .contenido { padding: 20px 16px 32px; }
  .titulo-seccion { font-size: 12px; font-weight: 800; color: #FFFFFF; text-transform: uppercase; letter-spacing: 0.5px; margin: 18px 0 8px; background: var(--color-gris-seccion); padding: 7px 12px; border-radius: 8px; }
  .titulo-seccion:first-child { margin-top: 0; }
  .fila-dato { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--color-borde); border-radius: 12px; margin-bottom: 8px; }
  .fila-dato .icono { width: 32px; height: 32px; border-radius: 50%; background: var(--color-verde-menta); display: flex; align-items: center; justify-content: center; color: var(--color-verde-esmeralda); font-size: 15px; flex-shrink: 0; }
  .fila-dato .texto .etiqueta { font-size: 11px; color: #7A7A7A; }
  .fila-dato .texto .valor { font-size: 14px; font-weight: 700; color: var(--color-gris-carbon); }
  .valor.pendiente { color: #B0B0AC; font-weight: 400; font-style: italic; }
  .caja-concurso { background: var(--color-verde-esmeralda); border-radius: 14px; padding: 16px; margin-top: 6px; text-align: center; }
  .caja-concurso .etiqueta-final { font-size: 11px; color: var(--color-verde-menta); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .caja-concurso .valor-final { font-size: 26px; font-weight: 800; color: #FFFFFF; margin-top: 2px; }
</style>
</head>
<body>
<div class="pantalla">
  <div class="cabecera-app">
    <span class="volver" onclick="window.location.href='inicio.html'">←</span>
    <span class="marca">Mi ficha</span>
  </div>

  <div class="contenido" id="contenidoFicha">
    <p style="text-align:center; color:#7A7A7A; font-size:13px;">Cargando datos...</p>
  </div>
</div>

<script>
  const URL_API = 'https://script.google.com/macros/s/AKfycbxylD45E6vlENV_Ttrl54jWPvhaQ1YdCBedoIQANAmM0UjDPEnWWRfa2_VpVSxR01ho/exec';

  const sesionTexto = localStorage.getItem('sesionOposicionesPT');
  if (!sesionTexto) {
    window.location.href = 'index.html';
  }
  const sesion = JSON.parse(sesionTexto);

  async function llamarBackend(accion, datos) {
    const respuesta = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion, datos }) });
    return respuesta.json();
  }

  function filaDato(icono, etiqueta, valor) {
    const hayValor = valor !== null && valor !== undefined && valor !== '';
    return `
      <div class="fila-dato">
        <div class="icono"><i class="ti ${icono}" aria-hidden="true"></i></div>
        <div class="texto">
          <div class="etiqueta">${etiqueta}</div>
          <div class="valor ${hayValor ? '' : 'pendiente'}">${hayValor ? valor : 'Sin datos todavía'}</div>
        </div>
      </div>`;
  }

  async function cargarFicha() {
    const resultado = await llamarBackend('obtenerFicha', { email: sesion.email });
    const contenedor = document.getElementById('contenidoFicha');

    if (!resultado.exito) {
      contenedor.innerHTML = `<p style="text-align:center; color:#D96C56; font-size:13px;">${resultado.mensaje}</p>`;
      return;
    }

    const f = resultado.resultado;
    const nombreCompleto = [f.nombre, f.apellidos].filter(Boolean).join(' ');

    contenedor.innerHTML = `
      <div class="titulo-seccion">Datos personales</div>
      ${filaDato('ti-user', 'Nombre completo', nombreCompleto)}
      ${filaDato('ti-mail', 'Email', f.email)}
      ${filaDato('ti-phone', 'Teléfono', f.telefono)}
      ${filaDato('ti-cake', 'Fecha de nacimiento', f.fechaNacimiento)}

      <div class="titulo-seccion">Datos de la oposición</div>
      ${filaDato('ti-map-pin', 'Comunidad autónoma', f.comunidadAutonoma)}
      ${filaDato('ti-school', 'Modalidad', f.modalidad)}
      ${filaDato('ti-calendar-event', 'Convocatoria actual', f.convocatoriaActual)}
    `;
  }

  cargarFicha();
</script>
</body>
</html>
