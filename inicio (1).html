<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oposiciones PT — Inicio</title>
<link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
  :root {
    --color-verde-esmeralda: #1E8A6E;
    --color-verde-menta: #D4EBE8;
    --color-amarillo-mostaza: #F2C94C;
    --color-gris-carbon: #3A3A3A;
    --color-gris-cabecera: #F4F4F2;
    --color-fondo: #EDEDEA;
    --color-borde: #E0E0DC;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--color-fondo); margin: 0; display: flex; justify-content: center; }
  .pantalla { width: 100%; max-width: 400px; background: #FFFFFF; min-height: 100vh; }
  .cabecera-app { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--color-gris-cabecera); border-bottom: 1px solid var(--color-borde); position: sticky; top: 0; z-index: 10; }
  .marca { font-family: 'Pompiere', cursive; font-size: 19px; color: var(--color-gris-carbon); }
  .avatar { margin-left: auto; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--color-gris-carbon); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
  .menu-sesion { position: absolute; top: 38px; right: 0; background: #FFFFFF; border: 1px solid var(--color-borde); border-radius: 10px; width: 170px; box-shadow: 0 6px 16px rgba(0,0,0,0.1); overflow: hidden; display: none; z-index: 20; text-align: left; }
  .menu-sesion.abierto { display: block; }
  .menu-sesion .nombre { padding: 10px 12px; font-size: 12px; color: #7A7A7A; border-bottom: 1px solid var(--color-borde); }
  .menu-sesion .item { padding: 11px 12px; font-size: 13px; color: var(--color-gris-carbon); display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .menu-sesion .item.salir { color: #D96C56; border-top: 1px solid var(--color-borde); }
  .contenido { padding: 20px 16px 32px; }
  .rejilla-inicio { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .boton-funcion { background: #FFFFFF; border: 0.5px solid var(--color-borde); border-radius: 14px; padding: 20px 8px; text-align: center; cursor: pointer; }
  .boton-funcion .icono { width: 56px; height: 56px; border-radius: 50%; background: var(--color-verde-menta); border: 2px dashed var(--color-amarillo-mostaza); display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-size: 26px; color: var(--color-verde-esmeralda); }
  .boton-funcion span { font-size: 14px; color: var(--color-gris-carbon); font-weight: 600; }
</style>
</head>
<body>
<div class="pantalla">
  <div class="cabecera-app">
    <svg width="30" height="30" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16.5" fill="#D4EBE8" stroke="#F2C94C" stroke-width="1.4" stroke-dasharray="2 2.4"/>
      <text x="18" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3A3A3A">AS</text>
    </svg>
    <span class="marca">Oposiciones PT</span>
    <div class="avatar" onclick="document.getElementById('menuSesion').classList.toggle('abierto')">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3A3A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="4"></circle>
        <path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
      </svg>
      <div class="menu-sesion" id="menuSesion">
        <div class="nombre" id="nombreSesion">—</div>
        <div class="item" onclick="window.location.href='mi-cuenta.html'">⚙️ Mi cuenta</div>
        <div class="item salir" onclick="cerrarSesion()">↩ Cerrar sesión</div>
      </div>
    </div>
  </div>

  <div class="contenido">
    <p style="font-size:12px; color:#7A7A7A; margin:0 0 14px;">Inicio</p>
    <div class="rejilla-inicio">
      <div class="boton-funcion" onclick="window.location.href='mi-ficha.html'">
        <div class="icono"><i class="ti ti-user" aria-hidden="true"></i></div>
        <span>Mi ficha</span>
      </div>
      <div class="boton-funcion" onclick="window.location.href='notas.html'">
        <div class="icono"><i class="ti ti-circle-check" aria-hidden="true"></i></div>
        <span>Notas Opos</span>
      </div>
      <div class="boton-funcion" onclick="window.location.href='tutorias.html'">
        <div class="icono"><i class="ti ti-calendar" aria-hidden="true"></i></div>
        <span>Tutorías</span>
      </div>
      <div class="boton-funcion" onclick="window.location.href='defensa-expo.html'">
        <div class="icono"><i class="ti ti-message-circle" aria-hidden="true"></i></div>
        <span>Defensa/Expo oral</span>
      </div>
      <div class="boton-funcion" onclick="window.location.href='calculadora-meritos.html'">
        <div class="icono"><i class="ti ti-calculator" aria-hidden="true"></i></div>
        <span>Calc. de méritos</span>
      </div>
    </div>
  </div>
</div>

<script>
  const sesionTexto = localStorage.getItem('sesionOposicionesPT');
  if (!sesionTexto) {
    window.location.href = 'index.html';
  } else {
    const sesion = JSON.parse(sesionTexto);
    document.getElementById('nombreSesion').textContent = sesion.nombre || sesion.email;
  }

  function cerrarSesion() {
    localStorage.removeItem('sesionOposicionesPT');
    window.location.href = 'index.html';
  }
</script>
</body>
</html>
