<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oposiciones PT — Cambiar contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================
   OPOSICIONES PT — Hoja de estilos compartida
   Paleta e identidad basada en el logo de Ángela Saloz
   ============================================ */

:root {
  --color-verde-esmeralda: #1E8A6E;
  --color-verde-menta: #D4EBE8;
  --color-amarillo-mostaza: #F2C94C;
  --color-gris-carbon: #3A3A3A;
  --color-gris-medio: #7A7A7A;
  --color-gris-cabecera: #F4F4F2;
  --color-gris-seccion: #96A9A4;
  --color-blanco: #FFFFFF;
  --color-fondo: #EDEDEA;
  --color-borde: #E0E0DC;
  --color-suspensa: #D96C56;
  --color-media: #B08A00;
  --color-media-fondo: #FBF0D2;
  --color-suspensa-fondo: #FBE0D5;
}

* { box-sizing: border-box; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--color-fondo);
  margin: 0;
  color: var(--color-gris-carbon);
}

/* --- Cabecera fija --- */
.cabecera-app {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  background: var(--color-gris-cabecera);
  border-bottom: 1px solid var(--color-borde);
  position: sticky;
  top: 0;
  z-index: 10;
}

.cabecera-app .marca {
  font-family: 'Pompiere', cursive;
  font-size: 19px;
  color: var(--color-gris-carbon);
}

.cabecera-app .avatar {
  margin-left: auto;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 1.5px solid var(--color-gris-carbon);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
}

.menu-sesion {
  position: absolute;
  top: 38px;
  right: 0;
  background: var(--color-blanco);
  border: 1px solid var(--color-borde);
  border-radius: 10px;
  width: 160px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.1);
  overflow: hidden;
  display: none;
  z-index: 20;
}
.menu-sesion.abierto { display: block; }
.menu-sesion .nombre { padding: 10px 12px; font-size: 12px; color: var(--color-gris-medio); border-bottom: 1px solid var(--color-borde); }
.menu-sesion .item { padding: 11px 12px; font-size: 13px; color: var(--color-gris-carbon); display: flex; align-items: center; gap: 8px; cursor: pointer; }
.menu-sesion .item.salir { color: var(--color-suspensa); border-top: 1px solid var(--color-borde); }

/* --- Contenedor tipo tarjeta / móvil --- */
.pantalla {
  max-width: 400px;
  margin: 0 auto;
  background: var(--color-blanco);
  min-height: 100vh;
}

.contenido { padding: 18px 16px 32px; }

/* --- Botones --- */
.boton-primario {
  width: 100%;
  background: var(--color-verde-menta);
  color: #1E5A4A;
  border: 1px solid #B7DCD6;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
}

.enlace-recuperar {
  text-align: center;
  font-size: 12px;
  color: var(--color-verde-esmeralda);
  margin-top: 10px;
  cursor: pointer;
  text-decoration: underline;
}

input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  border: 1px solid #D8D8D4;
  font-size: 14px;
  font-family: 'Nunito', sans-serif;
  margin-bottom: 10px;
}

/* --- Rejilla de inicio --- */
.rejilla-inicio {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.boton-funcion {
  background: var(--color-blanco);
  border: 1px solid var(--color-borde);
  border-radius: 12px;
  padding: 14px 6px;
  text-align: center;
  cursor: pointer;
}

.boton-funcion .icono {
  width: 40px;
  height: 40px;
  border-radius: 10px;
  background: var(--color-verde-menta);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 6px;
  color: var(--color-verde-esmeralda);
  font-size: 20px;
}

.boton-funcion span { font-size: 11px; color: var(--color-gris-carbon); }

/* --- Secciones de notas --- */
.titulo-seccion {
  font-size: 12px;
  font-weight: 800;
  color: var(--color-blanco);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 18px 0 8px;
  background: var(--color-gris-seccion);
  padding: 7px 12px;
  border-radius: 8px;
}

.tarjeta-nota {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--color-blanco);
  border: 1px solid var(--color-borde);
  border-radius: 12px;
  padding: 12px 14px;
  margin-bottom: 8px;
}

.tarjeta-nota .izquierda { display: flex; align-items: center; gap: 10px; }
.tarjeta-nota .icono-caja {
  width: 34px; height: 34px; border-radius: 9px; background: var(--color-verde-menta);
  display: flex; align-items: center; justify-content: center; color: var(--color-verde-esmeralda); font-size: 16px;
}
.tarjeta-nota .nombre { font-size: 13px; font-weight: 600; }
.tarjeta-nota .nota-extra { font-size: 11px; color: var(--color-gris-medio); }
.tarjeta-nota .valor { font-size: 18px; font-weight: 800; }

.estado-aprobada { color: var(--color-verde-esmeralda); }
.estado-media { color: var(--color-media); }
.estado-suspensa { color: var(--color-suspensa); }

.etiqueta {
  font-size: 9px; font-weight: 700; padding: 2px 7px; border-radius: 20px; margin-left: 6px;
}
.etiqueta-aprobada { background: var(--color-verde-menta); color: var(--color-verde-esmeralda); }
.etiqueta-media { background: var(--color-media-fondo); color: var(--color-media); }
.etiqueta-suspensa { background: var(--color-suspensa-fondo); color: var(--color-suspensa); }

.caja-media {
  background: var(--color-gris-cabecera);
  border-radius: 12px;
  padding: 14px;
  margin: 10px 0 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.caja-final {
  background: var(--color-verde-esmeralda);
  border-radius: 14px;
  padding: 18px;
  margin-top: 20px;
  text-align: center;
}
.caja-final .etiqueta-final { font-size: 12px; color: var(--color-verde-menta); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
.caja-final .valor-final { font-size: 32px; font-weight: 800; color: var(--color-blanco); margin-top: 4px; }
.caja-final .desglose { font-size: 11px; color: var(--color-verde-menta); margin-top: 6px; }

/* --- Selector de alumna (vista administradora) --- */
.selector-alumna {
  display: flex; align-items: center; gap: 8px; background: var(--color-gris-cabecera);
  border: 1px solid var(--color-borde); border-radius: 10px; padding: 8px 12px; margin-bottom: 18px; font-size: 13px;
}

</style>
</head>
<body>
<div class="pantalla">
  <div class="contenido" style="display:flex; flex-direction:column; align-items:center; gap:14px; padding-top:60px; text-align:center;">
    <svg width="52" height="52" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16.5" fill="#D4EBE8" stroke="#F2C94C" stroke-width="1.4" stroke-dasharray="2 2.4"/>
      <text x="18" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3A3A3A">AS</text>
    </svg>
    <span class="marca" style="font-size:24px;">Oposiciones PT</span>
    <p style="font-size:13px; color:#555; margin:0;">Es tu primer acceso. Crea tu nueva contraseña para continuar.</p>
    <div style="width:100%;">
      <input type="password" placeholder="Nueva contraseña">
      <input type="password" placeholder="Repite la contraseña">
    </div>
    <button class="boton-primario">Guardar y entrar</button>
  </div>
</div>
</body>
</html>
