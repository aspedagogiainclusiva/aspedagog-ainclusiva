<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oposiciones PT — Tutorías</title>
<link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.47.0/iconfont/tabler-icons.min.css">
<style>
  :root {
    --color-verde-esmeralda: #1E8A6E;
    --color-verde-menta: #D4EBE8;
    --color-amarillo-mostaza: #F2C94C;
    --color-gris-carbon: #3A3A3A;
    --color-gris-cabecera: #F4F4F2;
    --color-gris-seccion: #96A9A4;
    --color-fondo: #EDEDEA;
    --color-borde: #E0E0DC;
    --color-suspensa: #D96C56;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--color-fondo); margin: 0; display: flex; justify-content: center; }
  .pantalla { width: 100%; max-width: 400px; background: #FFFFFF; min-height: 100vh; }
  .cabecera-app { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--color-gris-cabecera); border-bottom: 1px solid var(--color-borde); }
  .marca { font-family: 'Pompiere', cursive; font-size: 19px; color: var(--color-gris-carbon); }
  .volver { cursor: pointer; font-size: 20px; color: var(--color-gris-carbon); }
  .contenido { padding: 18px 16px 32px; }
  .titulo-fecha { font-size: 12px; font-weight: 800; color: #FFFFFF; text-transform: uppercase; letter-spacing: 0.5px; margin: 14px 0 8px; background: var(--color-gris-seccion); padding: 7px 12px; border-radius: 8px; }
  .titulo-fecha:first-child { margin-top: 0; }
  .franja { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--color-borde); }
  .franja .hora { font-size: 13px; font-weight: 700; color: var(--color-gris-carbon); }
  .franja .estado { font-size: 11px; color: #7A7A7A; }
  .franja.libre { background: var(--color-verde-menta); border-color: #B7DCD6; }
  .franja.reservada { background: #FBF0D2; border-color: #F0DFA0; }
  .franja.mia { background: var(--color-amarillo-mostaza); border-color: #E0B93A; }
  .franja.pendiente { background: #F4E8C8; border-color: #E0CC8A; }
  .boton-pequeno { background: var(--color-verde-esmeralda); color: #FFFFFF; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .boton-pequeno.cancelar { background: var(--color-suspensa); }
  .aviso { font-size: 12px; text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 14px; }
  .aviso.info { background: var(--color-verde-menta); color: #1E5A4A; }
  .aviso.error { background: #FBE0D5; color: var(--color-suspensa); }
</style>
</head>
<body>
<div class="pantalla">
  <div class="cabecera-app">
    <span class="volver" onclick="window.location.href='inicio.html'">←</span>
    <span class="marca">Tutorías</span>
  </div>

  <div class="contenido">
    <p style="font-size:12px; color:#7A7A7A; margin:0 0 4px;">Miércoles, septiembre–diciembre</p>
    <p style="font-size:11px; color:#7A7A7A; margin:0 0 16px;">Máximo 1 tutoría al mes. Confirma tu reserva en los primeros 3 minutos o se liberará.</p>

    <div id="avisoTutorias"></div>
    <div id="listaTutorias">
      <p style="text-align:center; color:#7A7A7A; font-size:13px;">Cargando franjas...</p>
    </div>
  </div>
</div>

<script>
  const URL_API = 'https://script.google.com/macros/s/AKfycbxylD45E6vlENV_Ttrl54jWPvhaQ1YdCBedoIQANAmM0UjDPEnWWRfa2_VpVSxR01ho/exec';

  const sesionTexto = localStorage.getItem('sesionOposicionesPT');
  if (!sesionTexto) {
    window.location.href = 'index.html';
  }
  const sesion = JSON.parse(sesionTexto);

  async function llamarBackend(accion, datos) {
    const respuesta = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion, datos }) });
    return respuesta.json();
  }

  function mostrarAviso(texto, tipo) {
    document.getElementById('avisoTutorias').innerHTML = `<div class="aviso ${tipo}">${texto}</div>`;
    setTimeout(() => { document.getElementById('avisoTutorias').innerHTML = ''; }, 4000);
  }

  function formatearFecha(fechaISO) {
    const [anio, mes, dia] = fechaISO.split('-');
    const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return `${dia} de ${meses[parseInt(mes, 10) - 1]}`;
  }

  async function cargarTutorias() {
    const resultado = await llamarBackend('listarTutorias', {});
    const lista = document.getElementById('listaTutorias');

    if (!resultado.exito) {
      lista.innerHTML = `<p style="text-align:center; color:#D96C56; font-size:13px;">No se pudieron cargar las tutorías.</p>`;
      return;
    }

    const porFecha = {};
    resultado.resultado.forEach(t => {
      if (!porFecha[t.fecha]) porFecha[t.fecha] = [];
      porFecha[t.fecha].push(t);
    });

    let html = '';
    Object.keys(porFecha).sort().forEach(fecha => {
      html += `<div class="titulo-fecha">${formatearFecha(fecha)}</div>`;
      porFecha[fecha].forEach(t => {
        const esMia = t.emailAlumna && t.emailAlumna.trim().toLowerCase() === sesion.email.trim().toLowerCase();
        let clase = 'libre';
        let textoEstado = 'Libre';
        let boton = `<button class="boton-pequeno" onclick="reservar('${t.idTutoria}','${t.fecha}')">Reservar</button>`;

        if (t.estado === 'Reservada' && esMia) {
          clase = 'mia'; textoEstado = 'Tu tutoría';
          boton = `<button class="boton-pequeno cancelar" onclick="cancelar('${t.idTutoria}','${t.fecha}')">Cancelar</button>`;
        } else if (t.estado === 'Pendiente confirmación' && esMia) {
          clase = 'pendiente'; textoEstado = 'Confírmala (3 min)';
          boton = `<button class="boton-pequeno" onclick="confirmar('${t.idTutoria}','${t.fecha}')">Confirmar</button>`;
        } else if (t.estado !== 'Libre') {
          clase = 'reservada'; textoEstado = 'Ocupada';
          boton = '';
        }

        html += `
          <div class="franja ${clase}">
            <div>
              <div class="hora">${t.franja}</div>
              <div class="estado">${textoEstado}</div>
            </div>
            ${boton}
          </div>`;
      });
    });

    lista.innerHTML = html || '<p style="text-align:center; color:#7A7A7A; font-size:13px;">No hay tutorías generadas todavía.</p>';
  }

  async function reservar(idTutoria, fecha) {
    const resultado = await llamarBackend('reservarTutoria', {
      idTutoria, fecha, emailAlumna: sesion.email, nombreAlumna: sesion.nombre
    });
    mostrarAviso(resultado.mensaje, resultado.exito ? 'info' : 'error');
    cargarTutorias();
  }

  async function confirmar(idTutoria, fecha) {
    const resultado = await llamarBackend('confirmarTutoria', {
      idTutoria, fecha, nombreAlumna: sesion.nombre
    });
    mostrarAviso(resultado.mensaje, resultado.exito ? 'info' : 'error');
    cargarTutorias();
  }

  async function cancelar(idTutoria, fecha) {
    const resultado = await llamarBackend('cancelarTutoria', {
      idTutoria, fecha, nombreAlumna: sesion.nombre
    });
    mostrarAviso(resultado.mensaje, resultado.exito ? 'info' : 'error');
    cargarTutorias();
  }

  cargarTutorias();
</script>
</body>
</html>
