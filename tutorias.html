<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oposiciones PT — Tutorías</title>
<link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.46.0/tabler-icons.min.css">
<style>
  :root {
    --color-verde-esmeralda: #1E8A6E;
    --color-verde-menta: #D4EBE8;
    --color-amarillo-mostaza: #F2C94C;
    --color-gris-carbon: #3A3A3A;
    --color-gris-cabecera: #F4F4F2;
    --color-fondo: #EDEDEA;
    --color-borde: #E0E0DC;
    --color-suspensa: #D96C56;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--color-fondo); margin: 0; display: flex; justify-content: center; }
  .pantalla { width: 100%; max-width: 400px; background: #FFFFFF; min-height: 100vh; position: relative; }
  .cabecera-app { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--color-gris-cabecera); border-bottom: 1px solid var(--color-borde); }
  .marca { font-family: 'Pompiere', cursive; font-size: 19px; color: var(--color-gris-carbon); }
  .volver { cursor: pointer; font-size: 20px; color: var(--color-gris-carbon); }
  .logo-cabecera { margin-left: auto; }
  .contenido { padding: 18px 16px 32px; }

  .grupo-mes { border-left: 4px solid var(--color-mes, #ccc); padding-left: 10px; margin-bottom: 18px; }
  .nombre-mes { font-size: 16px; font-weight: 800; color: var(--color-mes, #999); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }
  .titulo-fecha { font-size: 12px; font-weight: 700; color: var(--color-gris-carbon); margin: 10px 0 6px; }
  .titulo-fecha:first-child { margin-top: 0; }

  .franja { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--color-borde); }
  .franja .hora { font-size: 13px; font-weight: 700; color: var(--color-gris-carbon); }
  .franja .estado { font-size: 11px; color: #7A7A7A; }
  .franja.libre { background: var(--color-verde-menta); border-color: #B7DCD6; }
  .franja.reservada { background: #FBF0D2; border-color: #F0DFA0; }
  .franja.mia { background: var(--color-amarillo-mostaza); border-color: #E0B93A; }
  .franja.pendiente { background: #F4E8C8; border-color: #E0CC8A; }
  .boton-pequeno { background: var(--color-verde-esmeralda); color: #FFFFFF; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }
  .boton-pequeno.cancelar { background: var(--color-suspensa); }
  .boton-pequeno:disabled { opacity: 0.6; cursor: default; }

  .aviso { font-size: 12px; text-align: center; padding: 10px; border-radius: 10px; margin-bottom: 14px; }
  .aviso.info { background: var(--color-verde-menta); color: #1E5A4A; }
  .aviso.error { background: #FBE0D5; color: var(--color-suspensa); }
  .aviso-fecha { font-size: 11px; background: #FBE0D5; color: var(--color-suspensa); padding: 8px 10px; border-radius: 8px; margin: 0 0 8px; }
  .selector-alumna { display: flex; align-items: center; gap: 8px; background: var(--color-gris-cabecera); border: 1px solid var(--color-borde); border-radius: 10px; padding: 8px 12px; margin-bottom: 16px; font-size: 13px; }
  .selector-alumna select { flex: 1; border: none; background: transparent; font-size: 13px; font-family: 'Nunito', sans-serif; color: var(--color-gris-carbon); }

  .modal-fondo { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .modal-fondo.oculto { display: none; }
  .modal-confirmacion { background: #FFFFFF; border-radius: 16px; padding: 20px; text-align: center; width: 100%; max-width: 320px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
  .modal-confirmacion .titulo { font-size: 14px; font-weight: 700; color: var(--color-gris-carbon); margin-bottom: 4px; }
  .modal-confirmacion .cuenta { font-size: 12px; color: #7A7A7A; margin-bottom: 14px; }
  .modal-confirmacion .botones { display: flex; gap: 10px; }
  .modal-confirmacion button { flex: 1; padding: 11px; border-radius: 10px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; }
  .btn-confirmar-grande { background: var(--color-verde-esmeralda); color: #FFFFFF; }
  .btn-cancelar-grande { background: var(--color-suspensa); color: #FFFFFF; }
</style>
</head>
<body>
<div class="pantalla">
  <div class="cabecera-app">
    <span class="volver" onclick="window.location.href='inicio.html'">←</span>
    <span class="marca">Tutorías</span>
    <svg class="logo-cabecera" width="28" height="28" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16.5" fill="#D4EBE8" stroke="#F2C94C" stroke-width="1.4" stroke-dasharray="2 2.4"/>
      <text x="18" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3A3A3A">AS</text>
    </svg>
  </div>

  <div class="contenido">
    <p style="font-size:11px; color:#7A7A7A; margin:0 0 16px;">Máximo 1 tutoría al mes.</p>

    <div id="selectorAdmin"></div>
    <div id="avisoTutorias"></div>
    <div id="listaTutorias">
      <p style="text-align:center; color:#7A7A7A; font-size:13px;">Cargando franjas...</p>
    </div>
  </div>

  <div class="modal-fondo oculto" id="modalFondo">
    <div class="modal-confirmacion" id="modalContenido"></div>
  </div>
</div>

<script>
  const URL_API = 'https://script.google.com/macros/s/AKfycbxylD45E6vlENV_Ttrl54jWPvhaQ1YdCBedoIQANAmM0UjDPEnWWRfa2_VpVSxR01ho/exec';

  const sesionTexto = localStorage.getItem('sesionOposicionesPT');
  if (!sesionTexto) {
    window.location.href = 'index.html';
  }
  const sesion = JSON.parse(sesionTexto);

  let temporizadorBanner = null;
  let avisoFechaActivo = null;
  let emailActual = sesion.email;
  let nombreActual = sesion.nombre;

  async function inicializarSelector() {
    if (!sesion.esAdmin) return;

    const resultado = await llamarBackend('listarAlumnas', {});
    if (!resultado.exito) return;

    const opciones = resultado.resultado
      .map(a => `<option value="${a.email}" data-nombre="${a.nombre}">${a.nombre}</option>`)
      .join('');

    document.getElementById('selectorAdmin').innerHTML = `
      <div class="selector-alumna">
        <i class="ti ti-user" aria-hidden="true"></i>
        <select id="selectAlumna">${opciones}</select>
      </div>`;

    const select = document.getElementById('selectAlumna');
    select.value = sesion.email;
    select.addEventListener('change', (e) => {
      emailActual = e.target.value;
      nombreActual = e.target.selectedOptions[0].dataset.nombre;
      cargarTutorias();
    });
  }

  const coloresPorMes = {
    '09': '#7FB8D6',
    '10': '#B08AD1',
    '11': '#E8955F',
    '12': '#7FB88A'
  };
  const nombresMes = {
    '09': 'Septiembre', '10': 'Octubre', '11': 'Noviembre', '12': 'Diciembre'
  };
  const diasSemana = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const mesesCorto = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

  async function llamarBackend(accion, datos) {
    const respuesta = await fetch(URL_API, { method: 'POST', body: JSON.stringify({ accion, datos }) });
    return respuesta.json();
  }

  function mostrarAviso(texto, tipo) {
    document.getElementById('avisoTutorias').innerHTML = `<div class="aviso ${tipo}">${texto}</div>`;
    setTimeout(() => { document.getElementById('avisoTutorias').innerHTML = ''; }, 4000);
  }

  function formatearFecha(fechaISO) {
    const [anio, mes, dia] = fechaISO.split('-');
    const fechaObj = new Date(parseInt(anio,10), parseInt(mes,10)-1, parseInt(dia,10));
    const diaSemana = diasSemana[fechaObj.getDay()];
    return `${diaSemana}, ${parseInt(dia,10)} de ${mesesCorto[parseInt(mes,10)-1]}`;
  }

  function abrirModal(html) {
    document.getElementById('modalContenido').innerHTML = html;
    document.getElementById('modalFondo').classList.remove('oculto');
  }
  function cerrarModal() {
    document.getElementById('modalFondo').classList.add('oculto');
    document.getElementById('modalContenido').innerHTML = '';
  }

  function mostrarBannerConfirmacion(idTutoria, fecha, franja) {
    clearInterval(temporizadorBanner);
    let segundosRestantes = 120;

    function pintar() {
      const min = Math.floor(segundosRestantes / 60);
      const seg = String(segundosRestantes % 60).padStart(2, '0');
      abrirModal(`
        <div class="titulo">Confirma tu tutoría</div>
        <div class="cuenta">${formatearFecha(fecha)}, ${franja}<br>Tienes ${min}:${seg} para confirmar</div>
        <div class="botones">
          <button class="btn-cancelar-grande" onclick="cancelar('${idTutoria}','${fecha}', null)">Cancelar</button>
          <button class="btn-confirmar-grande" onclick="confirmar('${idTutoria}','${fecha}')">Confirmar</button>
        </div>`);
    }
    pintar();

    temporizadorBanner = setInterval(() => {
      segundosRestantes--;
      if (segundosRestantes <= 0) {
        clearInterval(temporizadorBanner);
        cerrarModal();
        cargarTutorias();
        return;
      }
      pintar();
    }, 1000);
  }

  async function cargarTutorias() {
    const resultado = await llamarBackend('listarTutorias', {});
    const lista = document.getElementById('listaTutorias');

    if (!resultado.exito) {
      lista.innerHTML = `<p style="text-align:center; color:#D96C56; font-size:13px;">No se pudieron cargar las tutorías.</p>`;
      return;
    }

    const porFecha = {};
    resultado.resultado.forEach(t => {
      if (!porFecha[t.fecha]) porFecha[t.fecha] = [];
      porFecha[t.fecha].push(t);
    });

    const fechasOrdenadas = Object.keys(porFecha).sort();
    let html = '';
    let mesActual = null;

    fechasOrdenadas.forEach(fecha => {
      const mesClave = fecha.substring(5, 7);

      if (mesClave !== mesActual) {
        if (mesActual !== null) html += `</div>`;
        html += `<div class="grupo-mes" style="--color-mes:${coloresPorMes[mesClave] || '#ccc'}">
                   <div class="nombre-mes">${nombresMes[mesClave] || mesClave}</div>`;
        mesActual = mesClave;
      }

      html += `<div class="titulo-fecha">${formatearFecha(fecha)}</div>`;

      if (avisoFechaActivo && avisoFechaActivo.fecha === fecha) {
        html += `<div class="aviso-fecha">${avisoFechaActivo.texto}</div>`;
      }

      porFecha[fecha].forEach(t => {
        const modoAdminGeneral = sesion.esAdmin && emailActual === sesion.email;
        const esMia = t.emailAlumna && t.emailAlumna.trim().toLowerCase() === emailActual.trim().toLowerCase();
        let clase = 'libre';
        let textoEstado = 'Libre';
        let boton = `<button class="boton-pequeno" onclick="reservar('${t.idTutoria}','${t.fecha}','${t.franja}', this)">Reservar</button>`;

        if (modoAdminGeneral) {
          // Vista general: se ve quién tiene cada franja, sin botones de acción
          boton = '';
          if (t.estado === 'Libre') {
            clase = 'libre'; textoEstado = 'Libre';
          } else if (t.estado === 'Pendiente confirmación') {
            clase = 'pendiente'; textoEstado = (t.nombreAlumna || 'Alguien') + ' (pendiente de confirmar)';
          } else {
            clase = 'reservada'; textoEstado = t.nombreAlumna || 'Reservada';
          }
        } else if (t.estado === 'Reservada' && esMia) {
          clase = 'mia'; textoEstado = 'Tu tutoría';
          boton = `<button class="boton-pequeno cancelar" onclick="cancelar('${t.idTutoria}','${t.fecha}', this)">Cancelar</button>`;
        } else if (t.estado === 'Pendiente confirmación' && esMia) {
          clase = 'pendiente'; textoEstado = 'Pendiente de confirmar';
          boton = '';
        } else if (t.estado !== 'Libre') {
          clase = 'reservada'; textoEstado = 'Ocupada';
          boton = '';
        }

        html += `
          <div class="franja ${clase}">
            <div>
              <div class="hora">${t.franja}</div>
              <div class="estado">${textoEstado}</div>
            </div>
            ${boton}
          </div>`;
      });
    });

    if (mesActual !== null) html += `</div>`;

    lista.innerHTML = html || '<p style="text-align:center; color:#7A7A7A; font-size:13px;">No hay tutorías generadas todavía.</p>';
  }

  async function reservar(idTutoria, fecha, franja, boton) {
    if (boton.disabled) return;
    boton.disabled = true;
    boton.textContent = 'Reservando...';
    avisoFechaActivo = null;

    const resultado = await llamarBackend('reservarTutoria', {
      idTutoria, fecha, emailAlumna: emailActual, nombreAlumna: nombreActual
    });

    if (resultado.exito) {
      mostrarBannerConfirmacion(idTutoria, fecha, franja);
      cargarTutorias();
    } else {
      if (resultado.mensaje && resultado.mensaje.toLowerCase().includes('ya tienes una tutoría')) {
        avisoFechaActivo = { fecha, texto: resultado.mensaje };
        cargarTutorias();
      } else {
        mostrarAviso(resultado.mensaje, 'error');
        boton.disabled = false;
        boton.textContent = 'Reservar';
      }
    }
  }

  async function confirmar(idTutoria, fecha) {
    clearInterval(temporizadorBanner);
    cerrarModal();
    const resultado = await llamarBackend('confirmarTutoria', {
      idTutoria, fecha, nombreAlumna: nombreActual
    });
    mostrarAviso(resultado.mensaje, resultado.exito ? 'info' : 'error');
    cargarTutorias();
  }

  async function cancelar(idTutoria, fecha, boton) {
    if (boton) {
      if (boton.disabled) return;
      boton.disabled = true;
      boton.textContent = 'Cancelando...';
    } else {
      clearInterval(temporizadorBanner);
      cerrarModal();
    }

    const resultado = await llamarBackend('cancelarTutoria', {
      idTutoria, fecha, nombreAlumna: nombreActual
    });
    mostrarAviso(resultado.mensaje, resultado.exito ? 'info' : 'error');
    cargarTutorias();
  }

  inicializarSelector();
  cargarTutorias();
</script>
</body>
</html>
