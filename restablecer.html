<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oposiciones PT — Restablecer contraseña</title>
<link href="https://fonts.googleapis.com/css2?family=Pompiere&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --color-verde-esmeralda: #1E8A6E;
    --color-verde-menta: #D4EBE8;
    --color-amarillo-mostaza: #F2C94C;
    --color-gris-carbon: #3A3A3A;
    --color-fondo: #EDEDEA;
    --color-borde: #E0E0DC;
    --color-suspensa: #D96C56;
  }
  * { box-sizing: border-box; }
  body { font-family: 'Nunito', sans-serif; background: var(--color-fondo); margin: 0; display: flex; justify-content: center; padding: 40px 20px; }
  .pantalla { width: 340px; background: #FFFFFF; border-radius: 24px; border: 1px solid var(--color-borde); overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.08); }
  .contenido { padding: 36px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .marca { font-family: 'Pompiere', cursive; font-size: 24px; color: var(--color-gris-carbon); }
  p.texto { font-size: 13px; color: #555; margin: 0; }
  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #D8D8D4; font-size: 14px; font-family: 'Nunito', sans-serif; }
  .boton-primario { width: 100%; background: var(--color-verde-menta); color: #1E5A4A; border: 1px solid #B7DCD6; padding: 12px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .aviso-error { font-size: 13px; color: var(--color-suspensa); margin: 0; }
  .aviso-exito { font-size: 13px; color: var(--color-verde-esmeralda); margin: 0; }
</style>
</head>
<body>
<div class="pantalla">
  <div class="contenido">
    <svg width="52" height="52" viewBox="0 0 36 36">
      <circle cx="18" cy="18" r="16.5" fill="#D4EBE8" stroke="#F2C94C" stroke-width="1.4" stroke-dasharray="2 2.4"/>
      <text x="18" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#3A3A3A">AS</text>
    </svg>
    <span class="marca">Oposiciones PT</span>
    <p class="texto">Crea tu nueva contraseña.</p>

    <div style="width:100%;">
      <input type="password" id="nueva" placeholder="Nueva contraseña" style="margin-bottom:10px;">
      <input type="password" id="repetir" placeholder="Repite la contraseña">
    </div>

    <button class="boton-primario" onclick="guardarNuevaContrasena()">Guardar contraseña</button>
    <p id="mensaje"></p>
  </div>
</div>

<script>
  const URL_API = 'https://script.google.com/macros/s/AKfycbxylD45E6vlENV_Ttrl54jWPvhaQ1YdCBedoIQANAmM0UjDPEnWWRfa2_VpVSxR01ho/exec';

  // Lee email y token de la URL (vienen del enlace del email)
  const parametros = new URLSearchParams(window.location.search);
  const email = parametros.get('email');
  const token = parametros.get('token');

  async function llamarBackend(accion, datos) {
    const respuesta = await fetch(URL_API, {
      method: 'POST',
      body: JSON.stringify({ accion, datos })
    });
    return respuesta.json();
  }

  async function guardarNuevaContrasena() {
    const nueva = document.getElementById('nueva').value;
    const repetir = document.getElementById('repetir').value;
    const mensaje = document.getElementById('mensaje');

    if (!email || !token) {
      mensaje.className = 'aviso-error';
      mensaje.textContent = 'Enlace no válido. Solicita uno nuevo desde la pantalla de inicio de sesión.';
      return;
    }
    if (nueva !== repetir) {
      mensaje.className = 'aviso-error';
      mensaje.textContent = 'Las contraseñas no coinciden.';
      return;
    }

    const resultado = await llamarBackend('restablecerContrasena', { email, token, nuevaContrasena: nueva });
    mensaje.className = resultado.exito ? 'aviso-exito' : 'aviso-error';
    mensaje.textContent = resultado.mensaje;

    if (resultado.exito) {
      setTimeout(() => { window.location.href = 'index.html'; }, 2000);
    }
  }
</script>
</body>
</html>
